<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You're offline — AccsMarkets</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f8f8;
      --fg: #111111;
      --muted: #666666;
      --brand: #f97316;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --surface: #141414;
        --fg: #f2f2f2;
        --muted: #888888;
        --brand: #fb923c;
        --border: #2a2a2a;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        env(safe-area-inset-top, 1.5rem)
        env(safe-area-inset-right, 1.5rem)
        env(safe-area-inset-bottom, 1.5rem)
        env(safe-area-inset-left, 1.5rem);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    .brand {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand);
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      margin-bottom: 0.625rem;
    }
    p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 1.75rem;
    }
    button {
      background: var(--brand);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 0.75rem;
      padding: 0.65rem 1.75rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.88; }
    button:active { opacity: 0.75; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <div class="brand">AccsMarkets</div>
    <h1>You're offline</h1>
    <p>Check your internet connection and try again. Your data is safe and will sync when you reconnect.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
